<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerződések – Ingatlan Kezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ingatlan Kezelő Rendszer</h1>
       <nav>
            <a href="index.html">Dashboard</a>
            <a href="helyisegek.html">Helyiségek</a>
            <a href="berlok.html">Bérlők</a>
            <a href="szerzodesek.html" class="aktiv">Szerződések</a>
            <a href="foglalasok.html">Foglalások</a>
            <a href="felhasznalok.html">Felhasználók</a>
            <a href="#" onclick="kijelentkezes()">Kilépés</a>
        </nav>
    </header>

    <main>
        <div class="oldal-fejlec">
            <h2>Szerződések</h2>
            <button id="uj-gomb" onclick="urlapMegjelenites()">+ Új szerződés</button>
        </div>

        <div id="urlap" class="rejtett">
            <h3 id="urlap-cim">Új szerződés hozzáadása</h3>
            <select id="berlo_id">
                <option value="">Válassz bérlőt *</option>
            </select>
            <select id="helyiseg_id">
                <option value="">Válassz helyiséget *</option>
            </select>
            <input type="date" id="kezdet">
            <input type="date" id="vege">
            <input type="number" id="havi_dij" placeholder="Havi díj (Ft)">
            <select id="statusz">
                <option value="aktív">Aktív</option>
                <option value="lejárt">Lejárt</option>
                <option value="felmondott">Felmondott</option>
            </select>
            <input type="text" id="megjegyzes" placeholder="Megjegyzés">
            <label style="font-size:13px;color:#6b7280;margin-bottom:4px;display:block">Fájl feltöltése (szerződés)</label>
            <input type="file" id="fajl" accept=".pdf,.jpg,.jpeg,.png">
            <div class="urlap-gombok">
                <button onclick="mentese()">Mentés</button>
                <button onclick="urlapElrejtes()">Mégse</button>
            </div>
        </div>
        <div class="szuro-sor">
            <input type="text" id="kereses" placeholder="🔍 Keresés bérlő vagy helyiség neve alapján..." oninput="szures()">
            <select id="statusz-szuro" onchange="szures()">
                <option value="">Minden státusz</option>
                <option value="aktív">Aktív</option>
                <option value="lejárt">Lejárt</option>
                <option value="felmondott">Felmondott</option>
            </select>
        </div>
        <div id="szerzodesek-lista">
            Betöltés...
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="szerzodesek.js"></script>
</body>
</html>
