<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalások – Ingatlan Kezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ingatlan Kezelő Rendszer</h1>
      <nav>
            <a href="index.html">Dashboard</a>
            <a href="helyisegek.html">Helyiségek</a>
            <a href="berlok.html">Bérlők</a>
            <a href="szerzodesek.html">Szerződések</a>
            <a href="foglalasok.html" class="aktiv">Foglalások</a>
            <a href="felhasznalok.html">Felhasználók</a>
            <a href="#" onclick="kijelentkezes()">Kilépés</a>
        </nav>
    </header>

    <main>
        <div class="oldal-fejlec">
            <h2>Foglalások</h2>
            <button id="uj-gomb" onclick="urlapMegjelenites()">+ Új foglalás</button>
        </div>

       <div id="urlap" class="rejtett">
            <h3 id="urlap-cim">Új foglalás hozzáadása</h3>
            <input type="text" id="cim" placeholder="Rendezvény neve *">
            <select id="helyiseg_id">
                <option value="">Válassz helyiséget *</option>
            </select>
            <select id="berlo_id">
                <option value="">Válassz bérlőt (elhagyható)</option>
            </select>
            <input type="datetime-local" id="kezdet">
            <input type="datetime-local" id="vege">
            <input type="number" id="letszam" placeholder="Várható létszám (fő)">
            <select id="statusz">
                <option value="függőben">Függőben</option>
                <option value="megerősítve">Megerősítve</option>
                <option value="lemondva">Lemondva</option>
            </select>
            <input type="text" id="megjegyzes" placeholder="Megjegyzés">
            <div class="urlap-gombok">
                <button onclick="mentese()">Mentés</button>
                <button onclick="urlapElrejtes()">Mégse</button>
            </div>
        </div>

        <div id="foglalasok-lista">
            Betöltés...
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="foglalasok.js"></script>
</body>
</html>
