<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Épületek – Ingatlan Kezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ingatlan Kezelő Rendszer</h1>
        <button class="hamburger" onclick="menuValt()">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="foMenu">
            <a href="index.html">Dashboard</a>
            <a href="helyisegek.html">Helyiségek</a>
            <a href="epuletek.html">Épületek</a>
            <a href="berlok.html">Bérlők</a>
            <a href="szerzodesek.html">Szerződések</a>
            <a href="foglalasok.html">Foglalások</a>
            <a href="felhasznalok.html">Felhasználók</a>
            <button onclick="setemaValt()" id="tema-gomb" style="background:none;border:none;cursor:pointer;font-size:20px;padding:4px 8px;">🌙</button>
            <a href="#" onclick="kijelentkezes()">Kilépés</a>
        </nav>
    </header>
    
    <main>
        <div class="oldal-fejlec">
            <h2>Épületek és Emeletek</h2>
            <button onclick="urlapMegjelenites()">+ Új épület</button>
        </div>

        <div id="urlap" class="rejtett">
            <h3 id="urlap-cim">Új épület hozzáadása</h3>
            <input type="text" id="nev" placeholder="Épület neve *">
            <input type="text" id="cim" placeholder="Cím">
            <input type="text" id="leiras" placeholder="Leírás">
            <div class="urlap-gombok">
                <button onclick="mentese()">Mentés</button>
                <button onclick="urlapElrejtes()">Mégse</button>
            </div>
        </div>

        <div id="emelet-urlap" class="rejtett">
            <h3 id="emelet-urlap-cim">Új emelet hozzáadása</h3>
            <select id="emelet-epulet-id">
                <option value="">Válassz épületet *</option>
            </select>
            <input type="text" id="emelet-nev" placeholder="Emelet neve * (pl. F0, F1, Tetőtér)">
            <input type="text" id="emelet-leiras" placeholder="Leírás">
            <div class="urlap-gombok">
                <button onclick="emeletMentese()">Mentés</button>
                <button onclick="emeletUrlapElrejtes()">Mégse</button>
            </div>
        </div>

        <div id="epuletek-lista">
            Betöltés...
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="tema.js"></script>
    <script src="epuletek.js"></script>
</body>
</html>
