<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingatlan Kezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ingatlan Kezelő Rendszer</h1>
        <nav>
            <a href="index.html" class="aktiv">Helyiségek</a>
            <a href="berlok.html">Bérlők</a>
            <a href="szerzodesek.html">Szerződések</a>
            <a href="foglalasok.html">Foglalások</a>
            <a href="#" onclick="kijelentkezes()">Kilépés</a>
        </nav>
    </header>

    <main>
        <main>
        <div class="oldal-fejlec">
            <h2>Helyiségek</h2>
            <button id="uj-gomb" onclick="urlapMegjelenites()">+ Új helyiség</button>
        </div>

        <div id="urlap" class="rejtett">
            <h3>Új helyiség hozzáadása</h3>
            <input type="text" id="nev" placeholder="Helyiség neve *">
            <select id="tipus">
                <option value="iroda">Iroda</option>
                <option value="terem">Terem</option>
                <option value="raktár">Raktár</option>
            </select>
            <input type="number" id="terulet_m2" placeholder="Terület (m²)">
            <input type="number" id="ferohely" placeholder="Férőhely (fő)">
            <input type="text" id="leiras" placeholder="Leírás">
            <select id="statusz">
                <option value="szabad">Szabad</option>
                <option value="foglalt">Foglalt</option>
                <option value="karbantartás">Karbantartás</option>
            </select>
            <input type="number" id="ar_havi" placeholder="Havi díj (Ft)">
            <div class="urlap-gombok">
                <button onclick="mentese()">Mentés</button>
                <button onclick="urlapElrejtes()">Mégse</button>
            </div>
        </div>

        <div id="helyisegek-lista">
            Betöltés...
        </div>
    </main>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
