<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard – Ingatlan Kezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ingatlan Kezelő Rendszer</h1>
        <nav>
            <a href="index.html" class="aktiv">Dashboard</a>
            <a href="helyisegek.html">Helyiségek</a>
            <a href="berlok.html">Bérlők</a>
            <a href="szerzodesek.html">Szerződések</a>
            <a href="foglalasok.html">Foglalások</a>
            <a href="felhasznalok.html">Felhasználók</a>
            <button onclick="setemaValt()" id="tema-gomb" style="background:none;border:none;cursor:pointer;font-size:20px;padding:4px 8px;">🌙</button>
            <a href="#" onclick="kijelentkezes()">Kilépés</a>
        </nav>
    </header>

    <main>
        <div class="oldal-fejlec">
            <h2>Dashboard</h2>
            <span id="datum"></span>
        </div>

        <!-- Statisztikai kártyák -->
        <div class="stat-grid">
            <div class="stat-kartya">
                <div class="stat-ikon zold">🏢</div>
                <div class="stat-info">
                    <span class="stat-szam" id="szabad-helyisegek">–</span>
                    <span class="stat-cimke">Szabad helyiség</span>
                </div>
            </div>
            <div class="stat-kartya">
                <div class="stat-ikon piros">🔒</div>
                <div class="stat-info">
                    <span class="stat-szam" id="foglalt-helyisegek">–</span>
                    <span class="stat-cimke">Foglalt helyiség</span>
                </div>
            </div>
            <div class="stat-kartya">
                <div class="stat-ikon kek">📋</div>
                <div class="stat-info">
                    <span class="stat-szam" id="aktiv-szerzodesek">–</span>
                    <span class="stat-cimke">Aktív szerződés</span>
                </div>
            </div>
            <div class="stat-kartya">
                <div class="stat-ikon lila">👥</div>
                <div class="stat-info">
                    <span class="stat-szam" id="berlok-szama">–</span>
                    <span class="stat-cimke">Bérlő</span>
                </div>
            </div>
        </div>

        <!-- Közelgő foglalások és naptár -->
        <div class="dashboard-grid">
            <div class="dashboard-panel">
                <h3>Közelgő foglalások</h3>
                <div id="kozelgo-foglalasok">Betöltés...</div>
            </div>
            <div class="dashboard-panel">
                <h3>Naptár</h3>
                <div id="naptar"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
    <script src="tema.js"></script>
</body>
</html>
